name: contribution graph

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render the last 30 days
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_GRAPH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/contrib_month.py --out-dir assets

      - name: Commit when the graph moved
        run: |
          if git diff --quiet -- assets; then
            echo "no change"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "chore: refresh contribution graph" -- assets
          git push
